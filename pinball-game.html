<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinball Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        canvas {
            background: #333;
            border: 2px solid #666;
        }
        #score {
            color: #fff;
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <canvas id="pinballCanvas" width="800" height="600"></canvas>
    <div id="score">Score: 0</div>
    <p style="color: #999; font-size: 12px;">Press A/D to move flippers</p>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.17.1/matter.min.js"></script>
    <script>
        const { Engine, Render, World, Bodies, Body, Events } = Matter;
        
        const canvas = document.getElementById('pinballCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        let engine = Engine.create();

        // Create ball
        let ball = Bodies.circle(400, 300, 20, { restitution: 0.8, friction: 0.5 });
        
        // Create walls
        let walls = [
            Bodies.rectangle(400, 0, 810, 50, { isStatic: true }),
            Bodies.rectangle(400, 600, 810, 50, { isStatic: true }),
            Bodies.rectangle(0, 300, 50, 610, { isStatic: true }),
            Bodies.rectangle(800, 300, 50, 610, { isStatic: true })
        ];

        // Create bumpers
        let bumper1 = Bodies.rectangle(200, 500, 100, 20, { isStatic: true });
        let bumper2 = Bodies.rectangle(600, 500, 100, 20, { isStatic: true });
        let bumpers = [bumper1, bumper2];

        // Create flippers (dynamic, not static)
        let leftFlipper = Bodies.rectangle(200, 550, 100, 20, { friction: 0.5 });
        let rightFlipper = Bodies.rectangle(600, 550, 100, 20, { friction: 0.5 });
        let flippers = [leftFlipper, rightFlipper];

        World.add(engine.world, [ball, ...walls, ...bumpers, ...flippers]);

        // Scoring system
        let score = 0;
        Events.on(engine, 'collisionStart', function(event) {
            event.pairs.forEach(pair => {
                if (bumpers.includes(pair.bodyA) || bumpers.includes(pair.bodyB)) {
                    score += 10;
                    scoreDisplay.textContent = 'Score: ' + score;
                }
            });
        });

        // Flipper controls
        let keysPressed = { a: false, d: false };
        
        document.addEventListener('keydown', function(event) {
            if (event.key.toLowerCase() === 'a') keysPressed.a = true;
            if (event.key.toLowerCase() === 'd') keysPressed.d = true;
        });
        
        document.addEventListener('keyup', function(event) {
            if (event.key.toLowerCase() === 'a') keysPressed.a = false;
            if (event.key.toLowerCase() === 'd') keysPressed.d = false;
        });

        // Custom rendering
        function render() {
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw bodies
            [ball, ...walls, ...bumpers, ...flippers].forEach(body => {
                const vertices = body.vertices;
                ctx.fillStyle = bumpers.includes(body) ? '#ff6b6b' : 
                                flippers.includes(body) ? '#4ecdc4' :
                                walls.includes(body) ? '#666' : '#ffd700';
                
                ctx.beginPath();
                ctx.moveTo(vertices[0].x, vertices[0].y);
                for (let i = 1; i < vertices.length; i++) {
                    ctx.lineTo(vertices[i].x, vertices[i].y);
                }
                ctx.closePath();
                ctx.fill();
            });

            requestAnimationFrame(render);
        }

        // Game loop
        function update() {
            if (keysPressed.a) {
                Body.rotate(leftFlipper, -0.15);
            }
            if (keysPressed.d) {
                Body.rotate(rightFlipper, 0.15);
            }

            Engine.update(engine);
            requestAnimationFrame(update);
        }

        render();
        update();
    </script>
</body>
</html>
