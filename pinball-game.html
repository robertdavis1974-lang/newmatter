<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinball Game</title>
    <style>
        canvas {
            background: #333;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="pinballCanvas" width="800" height="600"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.17.1/matter.min.js"></script>
    <script>
        const { Engine, Render, World, Bodies, Body, Mouse, MouseConstraint } = Matter;

        let engine = Engine.create();
        let render = Render.create({
            element: document.body,
            engine: engine
        });

        // Create ball
        let ball = Bodies.circle(400, 300, 20, { restitution: 0.8 });
        // Create walls
        let walls = [
            Bodies.rectangle(400, 0, 810, 50, { isStatic: true }), // top wall
            Bodies.rectangle(400, 600, 810, 50, { isStatic: true }), // bottom wall
            Bodies.rectangle(0, 300, 50, 610, { isStatic: true }), // left wall
            Bodies.rectangle(800, 300, 50, 610, { isStatic: true }) // right wall
        ];

        // Create bumpers
        let bumper1 = Bodies.rectangle(200, 500, 100, 20, { isStatic: true });
        let bumper2 = Bodies.rectangle(600, 500, 100, 20, { isStatic: true });
        let bumpers = [bumper1, bumper2];

        // Create flippers
        let leftFlipper = Bodies.rectangle(200, 550, 100, 20, { isStatic: true });
        let rightFlipper = Bodies.rectangle(600, 550, 100, 20, { isStatic: true });
        let flippers = [leftFlipper, rightFlipper];

        World.add(engine.world, [ball, ...walls, ...bumpers, ...flippers]);

        // Scoring system
        let score = 0;
        Matter.Events.on(engine, 'collisionStart', function(event) {
            const pairs = event.pairs;

            pairs.forEach(pair => {
                if (bumpers.includes(pair.bodyA) || bumpers.includes(pair.bodyB)) {
                    score += 10;
                    console.log('Score:', score);
                }
            });
        });

        // Flipper controls
        document.addEventListener('keydown', function(event) {
            if (event.key === 'a') {
                Body.rotate(leftFlipper, -0.5);
            }
            if (event.key === 'd') {
                Body.rotate(rightFlipper, 0.5);
            }
        });

        Render.run(render);
        Engine.run(engine);
    </script>
</body>
</html>
